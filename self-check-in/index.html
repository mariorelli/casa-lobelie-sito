<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Self Check-in — Casa Lobelie</title>
<meta name="description" content="Casa Lobelie — guida al self check-in.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d4a78">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Nunito+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>/* Link diretto alla guida in una lingua (es. #/en): evita il lampo della schermata lingua */
if(/^#\/(it|en|es|fr)\/?$/.test(location.hash))document.documentElement.className+=" sc-direct";</script>
</head>
<body class="lang-gate-active">

<!-- =====================================================================
     SCHERMATA DI SELEZIONE DELLA LINGUA
     Riprodotta dalla Guest Guide (/guest/ → app.js renderGate + style.css
     .lang-gate): stesso logo, titolo, sottotitolo, pulsanti con bandiera.
     È scritta direttamente nell'HTML così compare subito, anche con
     connessione lenta, prima che il JavaScript venga eseguito.
     ===================================================================== -->
<div class="lang-gate" id="langGate">
  <div class="lang-gate-logo"><img src="images/logo.jpg" alt="Casa Lobelie" width="400" height="400"></div>
  <h1 class="lang-gate-title">Self Check-in</h1>
  <p class="lang-gate-subtitle">Scegli la tua lingua</p>
  <div class="lang-gate-buttons">
    <button type="button" class="lang-gate-btn" data-lang="it" lang="it"><span class="flag" aria-hidden="true">🇮🇹</span><span>Italiano</span></button>
    <button type="button" class="lang-gate-btn" data-lang="en" lang="en"><span class="flag" aria-hidden="true">🇬🇧</span><span>English</span></button>
    <button type="button" class="lang-gate-btn" data-lang="es" lang="es"><span class="flag" aria-hidden="true">🇪🇸</span><span>Español</span></button>
    <button type="button" class="lang-gate-btn" data-lang="fr" lang="fr"><span class="flag" aria-hidden="true">🇫🇷</span><span>Français</span></button>
  </div>
</div>

<!-- =====================================================================
     GUIDA AL SELF CHECK-IN (visibile dopo la scelta della lingua)
     I testi vengono inseriti da script.js in base alla lingua scelta.
     NOTA DI SICUREZZA: il codice della cassetta NON va mai scritto in
     questa pagina né in altri file: viene inviato agli ospiti via SMS.
     ===================================================================== -->
<header class="app-header" id="appHeader" hidden>
  <div class="app-header-inner">
    <div class="header-left">
      <button type="button" class="back-btn visible" id="changeLangBtn">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span class="logo-mark"><img src="images/logo.jpg" alt="Casa Lobelie" width="400" height="400"></span>
    </div>
    <nav class="lang-switch" id="langSwitch"></nav>
  </div>
</header>

<main id="guide" hidden>
  <div class="wrap">

    <section class="sc-intro" aria-labelledby="scTitle">
      <div class="home-logo-wrap"><img class="home-logo" src="images/logo.jpg" alt="Casa Lobelie" width="400" height="400"></div>
      <h1 id="scTitle" data-i18n="title"></h1>
      <p class="sc-subtitle" data-i18n="subtitle"></p>
      <p class="sc-lead" data-i18n="intro"></p>
    </section>

    <ol class="sc-steps">
      <!-- PASSAGGIO 1 — Cassetta portachiavi -->
      <li class="sc-step" id="step-1">
        <a class="sc-photo" href="images/box-chiavi.jpg" data-photo="box">
          <img src="images/box-chiavi-800.jpg"
               srcset="images/box-chiavi-800.jpg 800w, images/box-chiavi.jpg 1600w"
               sizes="(min-width: 820px) 370px, 100vw"
               width="1200" height="1600" loading="lazy" decoding="async" alt="">
          <span class="sc-zoom" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/><path d="M11 8.5v5"/><path d="M8.5 11h5"/></svg></span>
        </a>
        <div class="sc-step-body">
          <div class="sc-step-head"><span class="sc-num" aria-hidden="true">1</span><h2 data-i18n="s1title"></h2></div>
          <p data-i18n="s1p1"></p>
          <div class="sc-sms">
            <span class="icon-wrap"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/><path d="M9.5 7.5h5"/><path d="M9.5 10.5h3.5"/></svg></span>
            <p><span class="sc-sms-label" data-i18n="smsLabel"></span><span data-i18n="s1p2"></span></p>
          </div>
          <p data-i18n="s1p3"></p>
        </div>
      </li>

      <!-- PASSAGGIO 2 — Cancello esterno -->
      <li class="sc-step" id="step-2">
        <a class="sc-photo" href="images/cancello-esterno.jpg" data-photo="gate">
          <img src="images/cancello-esterno-800.jpg"
               srcset="images/cancello-esterno-800.jpg 800w, images/cancello-esterno.jpg 1600w"
               sizes="(min-width: 820px) 370px, 100vw"
               width="1200" height="1600" loading="lazy" decoding="async" alt="">
          <span class="sc-marker" style="left:11.4%;top:50.6%" aria-hidden="true"></span>
          <span class="sc-zoom" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/><path d="M11 8.5v5"/><path d="M8.5 11h5"/></svg></span>
        </a>
        <div class="sc-step-body">
          <div class="sc-step-head"><span class="sc-num" aria-hidden="true">2</span><h2 data-i18n="s2title"></h2></div>
          <p data-i18n="s2p1"></p>
        </div>
      </li>

      <!-- PASSAGGIO 3 — Porta dell'appartamento -->
      <li class="sc-step" id="step-3">
        <a class="sc-photo" href="images/porta-appartamento.jpg" data-photo="door">
          <img src="images/porta-appartamento-800.jpg"
               srcset="images/porta-appartamento-800.jpg 800w, images/porta-appartamento.jpg 1600w"
               sizes="(min-width: 820px) 370px, 100vw"
               width="1200" height="1600" loading="lazy" decoding="async" alt="">
          <span class="sc-marker" style="left:44.4%;top:26.1%" aria-hidden="true"></span>
          <span class="sc-zoom" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/><path d="M11 8.5v5"/><path d="M8.5 11h5"/></svg></span>
        </a>
        <div class="sc-step-body">
          <div class="sc-step-head"><span class="sc-num" aria-hidden="true">3</span><h2 data-i18n="s3title"></h2></div>
          <p data-i18n="s3p1"></p>
          <p data-i18n="s3p2"></p>
        </div>
      </li>
    </ol>

    <!-- PROMEMORIA CHIAVI -->
    <section class="panel sc-keys" aria-labelledby="keysTitle">
      <span class="icon-wrap"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9"/><path d="M17 6l3 3"/><path d="M14 9l2.5 2.5"/></svg></span>
      <div>
        <h2 id="keysTitle" data-i18n="keysTitle"></h2>
        <p data-i18n="keysP1"></p>
        <p data-i18n="keysP2"></p>
      </div>
    </section>

    <!-- ASSISTENZA WHATSAPP -->
    <section class="panel sc-help" aria-labelledby="helpTitle">
      <h2 id="helpTitle" data-i18n="helpTitle"></h2>
      <p data-i18n="helpText"></p>
      <a class="btn btn-primary" id="waBtn" href="https://wa.me/393335638730" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="none" d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.6.1-.2.3-.7.9-.9 1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.4.1-.2 0-.4 0-.5-.1-.1-.6-1.4-.8-1.9-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.1s1 2.5 1.1 2.6c.1.2 2 3 4.7 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.3.2-.6.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3z"/><path d="M12 3a9 9 0 00-7.7 13.6L3 21l4.5-1.2A9 9 0 1012 3z"/></svg>
        <span data-i18n="helpButton"></span>
      </a>
    </section>

    <p class="sc-change-lang"><button type="button" class="btn btn-ghost" id="changeLangBtn2">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <span data-i18n="changeLanguage"></span>
    </button></p>

  </div>

  <footer class="sc-footer">
    <img src="images/logo.jpg" alt="" width="400" height="400" loading="lazy">
    <p class="sc-footer-name">Casa Lobelie — Roma</p>
    <a href="https://casalobelie.it/" data-i18n="footerLink"></a>
  </footer>
</main>

<!-- Ingrandimento foto (dialog nativo, accessibile da tastiera) -->
<dialog class="sc-lightbox" id="lightbox">
  <button type="button" class="sc-lightbox-close" id="lightboxClose">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
  </button>
  <img id="lightboxImg" src="data:," alt="">
</dialog>

<noscript>
  <style>.lang-gate-buttons{display:none}</style>
  <p class="sc-noscript">Per visualizzare la guida attivate JavaScript. · Please enable JavaScript to view the guide.</p>
</noscript>

<script src="script.js"></script>
</body>
</html>
