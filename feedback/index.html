<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Questionario ospiti — Casa Lobelie</title>
<meta name="description" content="Casa Lobelie — questionario di soddisfazione degli ospiti.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">

<meta name="theme-color" content="#0d4a78">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://challenges.cloudflare.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&amp;family=Nunito+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>if(/^#\/(it|en|es|fr)\/?$/.test(location.hash))document.documentElement.className+=" sc-direct";</script>
</head>
<body class="lang-gate-active">

<!-- =====================================================================
     SCHERMATA DI SELEZIONE DELLA LINGUA
     Identica a /self-check-in/ e alla Guest Guide /guest/: stesso logo,
     stesso sottotitolo, stessi pulsanti con bandiera. Scritta nell'HTML
     così compare subito, anche con connessione lenta.
     ===================================================================== -->
<div class="lang-gate" id="langGate">
  <div class="lang-gate-logo"><img src="images/logo.jpg" alt="Casa Lobelie" width="400" height="400"></div>
  <h1 class="lang-gate-title">Feedback</h1>
  <p class="lang-gate-subtitle">Scegli la tua lingua</p>
  <div class="lang-gate-buttons">
    <button type="button" class="lang-gate-btn" data-lang="it" lang="it"><span class="flag" aria-hidden="true">🇮🇹</span><span>Italiano</span></button>
    <button type="button" class="lang-gate-btn" data-lang="en" lang="en"><span class="flag" aria-hidden="true">🇬🇧</span><span>English</span></button>
    <button type="button" class="lang-gate-btn" data-lang="es" lang="es"><span class="flag" aria-hidden="true">🇪🇸</span><span>Español</span></button>
    <button type="button" class="lang-gate-btn" data-lang="fr" lang="fr"><span class="flag" aria-hidden="true">🇫🇷</span><span>Français</span></button>
  </div>
</div>

<header class="app-header" id="appHeader" hidden>
  <div class="app-header-inner">
    <div class="header-left">
      <button type="button" class="back-btn visible" id="changeLangBtn">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span class="logo-mark"><img src="images/logo.jpg" alt="Casa Lobelie" width="400" height="400"></span>
    </div>
    <nav class="lang-switch" id="langSwitch"></nav>
  </div>
  <div class="fb-progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0">
    <div class="fb-progress-track"><div class="fb-progress-bar" id="progressBar"></div></div>
    <span class="fb-progress-label" id="progressLabel" aria-hidden="true">0/8</span>
  </div>
</header>

<main id="survey" hidden>
  <div class="wrap">

    <section class="sc-intro" aria-labelledby="fbTitle">
      <div class="home-logo-wrap"><img class="home-logo" src="images/logo.jpg" alt="Casa Lobelie" width="400" height="400"></div>
      <h1 id="fbTitle" data-i18n="title"></h1>
      <p class="sc-subtitle" data-i18n="subtitle"></p>
      <p class="sc-lead" data-i18n="intro"></p>
    </section>

    <form id="fbForm" novalidate>
      <section class="fb-section" aria-labelledby="sec1Title">
        <p class="fb-section-kicker" data-i18n="section1Kicker"></p>
        <h2 class="fb-section-title" id="sec1Title" data-i18n="section1"></h2>
        <div id="sec1Questions"></div>
      </section>

      <section class="fb-section" aria-labelledby="sec2Title">
        <p class="fb-section-kicker" data-i18n="section2Kicker"></p>
        <h2 class="fb-section-title" id="sec2Title" data-i18n="section2"></h2>
        <div id="sec2Questions"></div>
      </section>

      <section class="fb-section fb-notes" aria-labelledby="notesTitle">
        <p class="fb-section-kicker" data-i18n="notesKicker"></p>
        <div class="fb-q fb-q-notes">
          <label class="fb-notes-label" id="notesTitle" for="fbNotes" data-i18n="notesTitle"></label>
          <p class="fb-hint fb-notes-help" id="notesHelp" data-i18n="notesHelp"></p>
          <textarea class="fb-notes-input" id="fbNotes" name="additional_notes" rows="4" maxlength="500"
                    autocomplete="off" spellcheck="true" aria-describedby="notesHelp notesPrivacy"></textarea>
          <div class="fb-notes-foot">
            <span class="fb-notes-privacy" id="notesPrivacy" data-i18n="notesPrivacy"></span>
            <span class="fb-notes-count" id="notesCount" aria-hidden="true">0/500</span>
          </div>
          <span class="fb-sr-only" id="notesCountSr" aria-live="polite"></span>
        </div>
      </section>

      <div class="fb-submit-area">
        <div class="fb-turnstile" id="tsWidget"></div>
        <p class="fb-ts-status" id="tsStatus" aria-live="polite"></p>
        <button type="button" class="btn btn-ghost fb-ts-retry" id="tsRetry" hidden><span data-i18n="tsRetry"></span></button>

        <div class="fb-alert" id="formAlert" role="alert" hidden></div>

        <button type="submit" class="btn btn-primary fb-submit" id="submitBtn">
          <span class="fb-spinner" aria-hidden="true"></span>
          <span id="submitLabel" data-i18n="submit"></span>
        </button>
        <p class="fb-privacy"><span data-i18n="privacyNote"></span> <a id="privacyLink" href="/privacy.html" data-i18n="privacyLink"></a></p>
      </div>
    </form>

    <p class="sc-change-lang"><button type="button" class="btn btn-ghost" id="changeLangBtn2">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <span data-i18n="changeLanguage"></span>
    </button></p>
  </div>

  <footer class="sc-footer">
    <img src="images/logo.jpg" alt="" width="400" height="400" loading="lazy">
    <p class="sc-footer-name">Casa Lobelie — Roma</p>
    <a href="https://casalobelie.it/">casalobelie.it</a>
  </footer>
</main>

<!-- =====================================================================
     SCHERMATA FINALE: compare SOLO dopo una risposta positiva del server.
     ===================================================================== -->
<main id="thanks" class="fb-thanks" hidden>
  <div class="fb-thanks-inner">
    <div class="lang-gate-logo"><img src="images/logo.jpg" alt="Casa Lobelie" width="400" height="400"></div>
    <h1 id="thanksTitle" tabindex="-1" data-i18n="thanksTitle"></h1>
    <p class="fb-thanks-text" data-i18n="thanksText"></p>
    <p class="fb-thanks-text fb-thanks-hope" data-i18n="thanksHope"></p>
    <a class="btn btn-ghost fb-thanks-link" href="https://casalobelie.it/">casalobelie.it</a>
  </div>
</main>

<noscript>
  <style>.lang-gate-buttons{display:none}</style>
  <p class="sc-noscript">Per compilare il questionario attivate JavaScript. · Please enable JavaScript to fill in the questionnaire.</p>
</noscript>

<script src="script.js"></script>
</body>
</html>
